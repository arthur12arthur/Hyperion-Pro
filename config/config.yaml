# ============================================================
# HYPERION PRO v1 — Configuration principale
# ============================================================

system:
  name: "Hyperion Pro"
  version: "1.0.0"
  market: "lonab"
  timezone: "Africa/Ouagadougou"
  language: "fr"

# --- Gemini AI ---
gemini:
  model: "gemini-2.5-flash"
  vision_model: "gemini-2.5-flash"
  max_tokens: 8192
  temperature: 0.1

# --- Pipeline ---
pipeline:
  run_web_intelligence: true
  run_sentiment: true
  run_ml_ensemble: true
  run_hades: true
  min_confidence_score: 2

# --- Monte Carlo ---
monte_carlo:
  n_simulations: 10000
  seed: 42

# --- ML Ensemble ---
ml_ensemble:
  models: ["xgboost", "lightgbm", "random_forest"]
  min_agreement: 2

# --- HADES ---
hades:
  odds_drop_threshold: 0.30
  odds_spike_threshold: 0.50
  min_runners: 5
  max_uncertainty_score: 0.75

# --- Kelly ---
kelly:
  fraction: 0.25
  max_bet_pct: 0.05
  min_ev: 0.05

# --- Telegram ---
telegram:
  send_daily_report: true
  send_odds_alerts: true
  odds_alert_threshold: 0.20
  report_time: "07:00"

# --- Backtesting ---
backtesting:
  window_size: 30
  min_samples: 50

# --- Logging ---
logging:
  level: "INFO"
  file: "logs/hyperion.log"
  rotation: "7 days"
