# ============================================================
# HYPERION PRO v1 — Configuration principale
# ============================================================

system:
  name: "Hyperion Pro"
  version: "1.0.0"
  market: "lonab"
  timezone: "Africa/Ouagadougou"
  language: "fr"

# --- Gemini AI ---
gemini:
  model: "gemini-2.5-flash"
  vision_model: "gemini-2.5-flash"
  max_tokens: 8192
  temperature: 0.1

# --- Pipeline ---
pipeline:
  run_web_intelligence: true
  run_sentiment: true
  run_ml_ensemble: true
  run_hades: true
  min_confidence_score: 2

# --- Sources de données hippiques françaises ---
sources:
  # Sites pour l'historique des chevaux (PMU France)
  historical:
    - name: "turfoo"
      url: "https://www.turfoo.fr"
      search_url: "https://www.turfoo.fr/chevaux/{horse_name_slug}/"
      enabled: true
      weight: 0.9
      type: "galop_trot"

    - name: "zeturf"
      url: "https://www.zeturf.fr"
      search_url: "https://www.zeturf.fr/fr/chevaux/fiche/{horse_name_slug}"
      enabled: true
      weight: 0.85
      type: "galop_trot"

    - name: "turfomania"
      url: "https://www.turfomania.fr"
      search_url: "https://www.turfomania.fr/cheval/{horse_name_slug}"
      enabled: true
      weight: 0.8
      type: "galop_trot"

    - name: "paris_turf"
      url: "https://www.paris-turf.com"
      search_url: "https://www.paris-turf.com/recherche?q={horse_name}"
      enabled: false  # protégé anti-bot, désactivé par défaut
      weight: 0.85
      type: "galop_trot"

  # Pronostics experts
  pronostics:
    - name: "geny_course"
      url: "https://www.genycourse.com"
      search_url: "https://www.genycourse.com/recherche?cheval={horse_name}"
      enabled: true
      weight: 0.75
      type: "pronostic"

    - name: "zone_turf"
      url: "https://www.zone-turf.fr"
      search_url: "https://www.zone-turf.fr/cheval/{horse_name_slug}.html"
      enabled: true
      weight: 0.70
      type: "pronostic"

  # Source LONAB (programme du jour)
  lonab:
    programme_url: "https://lonab.bf/programme-pmub"
    base_url: "https://lonab.bf"
    pronostics: []  # pas de site tiers LONAB fiable

# --- Monte Carlo ---
monte_carlo:
  n_simulations: 10000
  seed: 42

# --- ML Ensemble ---
ml_ensemble:
  models: ["xgboost", "lightgbm", "random_forest"]
  min_agreement: 2

# --- HADES ---
hades:
  odds_drop_threshold: 0.30
  odds_spike_threshold: 0.50
  min_runners: 5
  max_uncertainty_score: 0.75

# --- Kelly ---
kelly:
  fraction: 0.25
  max_bet_pct: 0.05
  min_ev: 0.05

# --- Telegram ---
telegram:
  send_daily_report: true
  send_odds_alerts: true
  odds_alert_threshold: 0.20
  report_time: "07:00"

# --- Backtesting ---
backtesting:
  window_size: 30
  min_samples: 50

# --- Logging ---
logging:
  level: "INFO"
  file: "logs/hyperion.log"
  rotation: "7 days"
